<style>
/* Layout: menu lateral escuro fixo + coluna de trabalho com barra superior translúcida e um véu de cor no topo. Identidade LIT Digitall (Archivo + IBM Plex, azul LIT). */
:root{
  /* marca LIT: ciano do L, roxo do T, índigo do i */
  --brand-cyan:#41BEEE; --brand-purple:#7D3F91; --brand-indigo:#6964AA; --brand-deep:#1B1636;
  --bg:#F3F2F8; --surface:#FFFFFF; --surface-2:#F7F6FB; --surface-3:#ECEAF4; --ink:#1A1730; --ink-2:#36314F; --muted:#64607A; --line:#E3E0EE; --line-2:#CDC8DE;
  --accent:#0A78AB; --accent-2:#2FB3E8; --accent-soft:#E3F4FC; --accent-ink:#FFFFFF;
  --teal:#5F59A3; --teal-soft:#ECEBF7;
  --violet:#7D3F91; --violet-2:#9C5FB5; --violet-soft:#F4EAF8;
  --ok:#2B7A3F; --ok-soft:#E2F3E7; --mod:#8A6A00; --mod-soft:#FBF2D3; --high:#B85C00; --high-soft:#FCEEDD; --crit:#B42318; --crit-soft:#FDE6E3;
  --nav-bg:#161329; --nav-2:#221D3D; --nav-ink:#B9B4D6; --nav-strong:#FFFFFF; --nav-line:#2C2650;
  --video:#0D1620; --video-ink:#F2F6F9;
  --av1:#0A78AB; --av1b:#E3F4FC; --av2:#5F59A3; --av2b:#ECEBF7; --av3:#7D3F91; --av3b:#F4EAF8; --av4:#A15C00; --av4b:#FCEEDD; --av5:#B4235A; --av5b:#FCE7EF; --av6:#4A4766; --av6b:#ECEAF4;
  --scrim:rgba(14,11,28,.55);
  --sh-1:0 1px 2px rgba(26,23,48,.06);
  --sh-2:0 1px 2px rgba(26,23,48,.04),0 12px 32px -14px rgba(26,23,48,.24);
  --sh-3:0 30px 70px -24px rgba(26,23,48,.42);
  --f-display:"Archivo",system-ui,"Segoe UI",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  --r:14px; --r-sm:10px; --r-xs:7px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0B18; --surface:#15122A; --surface-2:#1B1733; --surface-3:#221D3F; --ink:#EEECF7; --ink-2:#CFCBE3; --muted:#9C97B8; --line:#2A2548; --line-2:#3A3460;
    --accent:#5CCBF2; --accent-2:#2FB3E8; --accent-soft:#0E2A3A; --accent-ink:#071820;
    --teal:#A29DE0; --teal-soft:#1F1C3D; --violet:#C28BD8; --violet-2:#9C5FB5; --violet-soft:#2A1736;
    --ok:#5FB877; --ok-soft:#10301B; --mod:#E0B84A; --mod-soft:#2D250E; --high:#E8955C; --high-soft:#33210E; --crit:#F97066; --crit-soft:#3A1613;
    --nav-bg:#08060F; --nav-2:#15122A; --nav-ink:#ADA8CC; --nav-strong:#FFFFFF; --nav-line:#221D3D;
    --av1:#5CCBF2; --av1b:#0E2A3A; --av2:#A29DE0; --av2b:#1F1C3D; --av3:#C28BD8; --av3b:#2A1736; --av4:#E8955C; --av4b:#33210E; --av5:#F17CA5; --av5b:#3A1426; --av6:#B0ABCC; --av6b:#221D3F;
    --scrim:rgba(0,0,0,.65);
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 1px 2px rgba(0,0,0,.35),0 14px 34px -14px rgba(0,0,0,.6); --sh-3:0 30px 70px -24px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0B18; --surface:#15122A; --surface-2:#1B1733; --surface-3:#221D3F; --ink:#EEECF7; --ink-2:#CFCBE3; --muted:#9C97B8; --line:#2A2548; --line-2:#3A3460;
  --accent:#5CCBF2; --accent-2:#2FB3E8; --accent-soft:#0E2A3A; --accent-ink:#071820;
  --teal:#A29DE0; --teal-soft:#1F1C3D; --violet:#C28BD8; --violet-2:#9C5FB5; --violet-soft:#2A1736;
  --ok:#5FB877; --ok-soft:#10301B; --mod:#E0B84A; --mod-soft:#2D250E; --high:#E8955C; --high-soft:#33210E; --crit:#F97066; --crit-soft:#3A1613;
  --nav-bg:#08060F; --nav-2:#15122A; --nav-ink:#ADA8CC; --nav-strong:#FFFFFF; --nav-line:#221D3D;
  --av1:#5CCBF2; --av1b:#0E2A3A; --av2:#A29DE0; --av2b:#1F1C3D; --av3:#C28BD8; --av3b:#2A1736; --av4:#E8955C; --av4b:#33210E; --av5:#F17CA5; --av5b:#3A1426; --av6:#B0ABCC; --av6b:#221D3F;
  --scrim:rgba(0,0,0,.65);
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 1px 2px rgba(0,0,0,.35),0 14px 34px -14px rgba(0,0,0,.6); --sh-3:0 30px 70px -24px rgba(0,0,0,.8);
  color-scheme:dark;
}
body{--cta-1:#1F9AD3;--cta-2:#0A6E9E}
body[data-prod="nr"]{--accent:var(--violet);--accent-2:var(--violet-2);--accent-soft:var(--violet-soft);--cta-1:#9A5BB3;--cta-2:#6E3482}
body[data-prod="home"]{--cta-1:#7A75C2;--cta-2:#55509A}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance;color:var(--ink)}
h1{font-size:clamp(28px,3.6vw,38px);font-weight:800;letter-spacing:-.02em}
h2{font-size:21px;font-weight:700;letter-spacing:-.01em}
h3{font-size:16px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
svg{flex:none}
.eyebrow{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow b{color:var(--accent)}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.ico{width:18px;height:18px;display:inline-block;vertical-align:middle}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- casca ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--nav-bg);color:var(--nav-ink);display:flex;flex-direction:column;gap:22px;
  padding:calc(22px + env(safe-area-inset-top,0px)) 16px 18px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;padding:0 6px}
.logo-sym{width:42px;height:42px;flex:none;display:block}
.logo-sym svg{width:100%;height:100%;display:block}
.brand .bt{display:flex;flex-direction:column;line-height:1.2}
.brand .bt strong{font:800 17px var(--f-display);color:var(--nav-strong);letter-spacing:-.01em}
.brand .bt strong em{font-style:normal;background:linear-gradient(90deg,var(--brand-cyan),#B48ACB);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .bt span{font-size:11.5px;color:var(--nav-ink)}
.prodsw{display:flex;flex-direction:column;gap:6px}
.prodsw .lbl{font:700 10.5px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:#7D77A3;padding:0 8px 4px}
.prodsw button{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid transparent;background:transparent;color:var(--nav-ink);padding:10px;border-radius:12px;cursor:pointer;font:inherit;width:100%}
.prodsw button:hover{background:var(--nav-2)}
.prodsw button .pi{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--nav-2);color:var(--nav-ink);flex:none}
.prodsw button b{display:block;font:600 14px var(--f-body);color:var(--nav-strong)}
.prodsw button small{display:block;font-size:11.5px;color:#8A84AE}
.prodsw button[aria-current="true"]{background:var(--nav-2);border-color:var(--nav-line)}
.prodsw button[aria-current="true"].cl .pi{background:linear-gradient(135deg,#41BEEE,#0A78AB);color:#fff;box-shadow:0 6px 16px -6px rgba(65,190,238,.7)}
.prodsw button[aria-current="true"].nr .pi{background:linear-gradient(135deg,#B07AC6,#7D3F91);color:#fff;box-shadow:0 6px 16px -6px rgba(176,122,198,.7)}
.prodsw button[aria-current="true"].home .pi{background:linear-gradient(135deg,#8E89CF,#6964AA);color:#fff;box-shadow:0 6px 16px -6px rgba(142,137,207,.7)}
.links{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--nav-line);padding-top:16px}
.links .lbl{font:700 10.5px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:#7D77A3;padding:0 10px 8px}
.links a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:9px;color:var(--nav-ink);text-decoration:none;font-weight:500;font-size:14px}
.links a:hover{background:var(--nav-2);color:var(--nav-strong)}
.links a[aria-current="page"]{background:rgba(255,255,255,.08);color:var(--nav-strong);font-weight:600}
.links a[aria-current="page"]{box-shadow:inset 3px 0 0 var(--brand-cyan)}
.links a[aria-current="page"] .ico{color:#41BEEE}
body[data-prod="nr"] .links a[aria-current="page"]{box-shadow:inset 3px 0 0 #B07AC6}
body[data-prod="nr"] .links a[aria-current="page"] .ico{color:#C890DC}
.links a .ico{color:#8A84AE}
.nav .glow{position:absolute;inset:auto -60px -80px -60px;height:260px;pointer-events:none;background:radial-gradient(200px 140px at 30% 60%,rgba(65,190,238,.16),transparent 70%),radial-gradient(200px 140px at 75% 70%,rgba(125,63,145,.22),transparent 70%)}
.me{margin-top:auto;display:flex;gap:12px;align-items:center;padding:14px 8px 0;border-top:1px solid var(--nav-line)}
.me .pic{width:38px;height:38px;border-radius:50%;overflow:hidden;flex:none;background:#203245}
.me .pic svg{width:100%;height:100%;display:block}
.me b{display:block;color:var(--nav-strong);font-size:13.5px;font-weight:600}
.me span{font-size:11.5px;color:#8A84AE}
.nav > *{position:relative;z-index:1}
.nav > .glow{z-index:0}
.wrap.enter > *{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.wrap.enter > *:nth-child(2){animation-delay:.05s} .wrap.enter > *:nth-child(3){animation-delay:.1s} .wrap.enter > *:nth-child(4){animation-delay:.15s} .wrap.enter > *:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.colm{min-width:0;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);min-width:0}
.crumbs b{color:var(--ink);font-weight:600}
.topbar .sp{flex:1}
.demo-tag{display:inline-flex;align-items:center;gap:7px;font:600 12px var(--f-body);color:var(--high);background:var(--high-soft);padding:6px 11px;border-radius:999px;white-space:nowrap}
.demo-tag i{width:7px;height:7px;border-radius:50%;background:var(--high)}
main{position:relative;padding-block:30px 80px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0;flex:1}
main::before{content:"";position:absolute;inset:0 0 auto 0;height:420px;pointer-events:none;z-index:0;
  background:radial-gradient(640px 280px at 88% -60px,color-mix(in srgb,var(--accent) 17%,transparent),transparent 70%),radial-gradient(520px 260px at 8% -90px,color-mix(in srgb,var(--teal) 13%,transparent),transparent 70%)}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px;min-width:0}
.wrap > *{min-width:0;max-width:100%}
.colm,main{min-width:0;max-width:100%}
@media (max-width:920px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav,.prodsw,.links{min-width:0;max-width:100%}
  .nav{position:relative;height:auto;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
  .prodsw{flex-direction:row;overflow-x:auto}
  .prodsw .lbl,.links .lbl,.me,.prodsw button small{display:none}
  .prodsw button{width:auto;flex:none;padding:6px 10px 6px 6px}
  .prodsw button .pi{width:28px;height:28px}
  .links{flex-direction:row;overflow-x:auto;border-top:0;padding-top:0}
  .links a{white-space:nowrap;flex:none}
  .topbar,main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar .demo-tag{display:none}
}

/* ---------- blocos ---------- */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 28px;flex-wrap:wrap}
.pagehead .t{display:flex;flex-direction:column;gap:8px;min-width:0;max-width:760px}
.pagehead p{color:var(--muted);font-size:15.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0;box-shadow:var(--sh-1)}
.card.elev{box-shadow:var(--sh-2)}
.card.flush{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h3{display:flex;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.grid-side{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:22px;align-items:start}
.grid-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:22px;align-items:start}
@media (max-width:1000px){.grid-side,.grid-main{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:var(--sh-1);min-width:0}
.kb{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.kb .ico{width:20px;height:20px}
.t-accent{background:var(--accent-soft);color:var(--accent)} .t-teal{background:var(--teal-soft);color:var(--teal)} .t-ok{background:var(--ok-soft);color:var(--ok)}
.t-high{background:var(--high-soft);color:var(--high)} .t-crit{background:var(--crit-soft);color:var(--crit)} .t-violet{background:var(--violet-soft);color:var(--violet)} .t-mod{background:var(--mod-soft);color:var(--mod)}
.kpi .kv{display:flex;flex-direction:column;min-width:0}
.kpi .kv b{font:800 24px/1.1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .kv span{font-size:12.5px;color:var(--muted)}

.btn{font:600 14px var(--f-body);padding:10px 16px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap;box-shadow:var(--sh-1);transition:border-color .15s,background .15s,transform .1s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn .ico{width:16px;height:16px}
.btn.primary{background:linear-gradient(180deg,var(--cta-1),var(--cta-2));border-color:transparent;color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 6px 16px -6px color-mix(in srgb,var(--cta-1) 75%,transparent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--accent);padding-inline:8px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.lg{padding:13px 22px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}

.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-body);padding:4px 10px 4px 9px;border-radius:999px;white-space:nowrap;line-height:1.3}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.nodot::before{display:none}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.mod{background:var(--mod-soft);color:var(--mod)} .chip.high{background:var(--high-soft);color:var(--high)}
.chip.crit{background:var(--crit-soft);color:var(--crit)} .chip.info{background:var(--accent-soft);color:var(--accent)} .chip.neutral{background:var(--surface-3);color:var(--muted)}
.chip.teal{background:var(--teal-soft);color:var(--teal)}

/* símbolo LIT: L ciano, i índigo, T roxo, em módulos circulares ligados */
function logo(mono){
  const R = 38.6, k = R * 0.707, q = R * 0.29, C = (c, r) => [50 + c*100, 50 + r*100];
  const neck = (a, b) => {
    const [x1, y1] = C(a[0], a[1]), [x2, y2] = C(b[0], b[1]);
    if(x1 === x2){ const m = (y1 + y2) / 2; return `M${x1-k} ${y1+k}Q${x1-q} ${m} ${x1-k} ${y2-k}L${x1+k} ${y2-k}Q${x1+q} ${m} ${x1+k} ${y1+k}Z`; }
    const m = (x1 + x2) / 2; return `M${x1+k} ${y1-k}Q${m} ${y1-q} ${x2-k} ${y1-k}L${x2-k} ${y1+k}Q${m} ${y1+q} ${x1+k} ${y1+k}Z`;
  };
  const grp = (fill, nodes, links) => `<g fill="${mono ? '#FFFFFF' : fill}">${nodes.map(n => { const [x, y] = C(n[0], n[1]); return `<circle cx="${x}" cy="${y}" r="${R}"/>`; }).join('')}<path d="${links.map(l => neck(l[0], l[1])).join('')}"/></g>`;
  return `<svg viewBox="0 0 400 400" role="img" aria-label="LIT">${
    grp('#41BEEE', [[0,0],[0,1],[0,2],[0,3],[1,3],[2,3]], [[[0,0],[0,1]],[[0,1],[0,2]],[[0,2],[0,3]],[[0,3],[1,3]],[[1,3],[2,3]]])}${
    grp('#6964AA', [[1,1],[1,2]], [[[1,1],[1,2]]])}${
    grp('#7D3F91', [[1,0],[2,0],[3,0],[2,1],[2,2]], [[[1,0],[2,0]],[[2,0],[3,0]],[[2,0],[2,1]],[[2,1],[2,2]]])}</svg>`;
}

function scoreRows(rows){
  return FACTORS.map((f, fi) => {
    let sum = 0, n = 0;
    rows.forEach(r => QUESTIONS.forEach((q, qx) => { if(q.fi !== fi) return; const v = r[qx]; if(v == null) return; sum += q.rev ? 4-v : v; n++; }));
    const score = n ? sum/n/4*100 : 0, Pp = probOf(score), R = Pp * f.sev;
    return {f, score, P:Pp, S:f.sev, R, level:lvl(R)};
  });
}
function sectorScores(cid, sid){ const rs = (S.responses[cid] || {})[sid] || []; return rs.length ? scoreRows(rs) : null; }
function companyFactorScores(cid){
  const c = company(cid); let rows = [];
  c.sectors.forEach(s => { if(respCount(cid, s.id) >= MIN_RESP) rows = rows.concat(S.responses[cid][s.id]); });
  return rows.length ? scoreRows(rows) : null;
}
function companyStats(cid){
  const c = company(cid); let resp = 0, visible = 0, hidden = 0, maxR = 0; const cells = [];
  c.sectors.forEach(s => {
    const n = respCount(cid, s.id); resp += n;
    if(n >= MIN_RESP){ visible++; sectorScores(cid, s.id).forEach(x => { cells.push({s, x}); if(x.R > maxR) maxR = x.R; }); }
    else if(n > 0) hidden++;
  });
  return {resp, rate: c.employees ? resp / c.employees : 0, visible, hidden, maxR, maxLevel: maxR ? lvl(maxR) : null, cells};
}
function genActions(cid){
  const c = company(cid); let added = 0;
  c.sectors.forEach(s => {
    if(respCount(cid, s.id) < MIN_RESP) return;
    sectorScores(cid, s.id).forEach(x => {
      if(x.R >= 8 && !S.actions.some(a => a.companyId === cid && a.sectorId === s.id && a.factor === x.f.id)){
        S.actions.push({id:uid('ac'), companyId:cid, sectorId:s.id, factor:x.f.id, text:SUGGEST[x.f.id], owner: x.f.id === 'rel' ? 'RH e CIPA' : 'RH e liderança do setor', due: dayKey(addDays(today0(), x.R >= 12 ? 30 : 60)), status:'nao'});
        added++;
      }
    });
  });
  return added;
}

function qrSvg(seedStr){
  const R = rng(hashN(seedStr)), N = 25; let rects = '';
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" rx="1.2" fill="#132230"/><rect x="${x+1}" y="${y+1}" width="5" height="5" rx=".8" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" rx=".6" fill="#132230"/>`;
  const inF = (x, y) => (x < 8 && y < 8) || (x >= N-8 && y < 8) || (x < 8 && y >= N-8) || (x > 9 && x < 15 && y > 9 && y < 15);
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){ if(!inF(x,y) && R() > .52) rects += `<rect x="${x+.08}" y="${y+.08}" width=".84" height=".84" rx=".25"/>`; }
  return `<svg viewBox="0 0 ${N} ${N}" role="img" aria-label="QR code Pix de demonstração"><rect width="${N}" height="${N}" fill="#fff"/><g fill="#132230">${rects}</g>${finder(0,0)}${finder(N-7,0)}${finder(0,N-7)}<rect x="10" y="10" width="5" height="5" rx="1.2" fill="#7D3F91"/><path d="M12.5 11 14 12.5 12.5 14 11 12.5z" fill="#fff"/></svg>`;
}

function spark(phqs){
  const W2 = 640, H = 170, padL = 34, padR = 40, padT = 16, padB = 28, n = phqs.length;
  const X = i => padL + (n === 1 ? 0 : i * (W2 - padL - padR) / (n - 1)), Y = v => padT + (1 - v/27) * (H - padT - padB);
  const pts = phqs.map((x, i) => `${X(i).toFixed(1)},${Y(x.phq).toFixed(1)}`).join(' ');
  const area = `${X(0).toFixed(1)},${Y(0).toFixed(1)} ${pts} ${X(n-1).toFixed(1)},${Y(0).toFixed(1)}`;
  const bands = [[0,5,'ok','Mínima'],[5,10,'mod','Leve'],[10,15,'high','Moderada'],[15,27,'crit','Grave']];
  const last = phqs[n-1];
  return `<svg class="spark" viewBox="0 0 ${W2} ${H}" role="img" aria-label="PHQ-9 de ${phqs[0].phq} para ${last.phq} pontos">
    <defs><linearGradient id="sparkfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${bands.map(b => `<rect x="${padL}" y="${Y(b[1]).toFixed(1)}" width="${W2-padL-padR}" height="${(Y(b[0]) - Y(b[1])).toFixed(1)}" fill="var(--${b[2]}-soft)" opacity=".7"/><text x="${W2-padR+6}" y="${((Y(b[0]) + Y(b[1]))/2 + 3).toFixed(1)}" font-size="10" font-family="IBM Plex Sans, sans-serif" fill="var(--${b[2]})">${b[3]}</text>`).join('')}
    ${[0,9,18,27].map(v => `<text x="${padL-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="var(--muted)">${v}</text>`).join('')}
    <polygon points="${area}" fill="url(#sparkfill)"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${phqs.map((x, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(x.phq).toFixed(1)}" r="${i === n-1 ? 6 : 4}" fill="${i === n-1 ? 'var(--accent)' : 'var(--surface)'}" stroke="var(--accent)" stroke-width="2.5"/><text x="${X(i).toFixed(1)}" y="${(Y(x.phq) - 11).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" font-family="IBM Plex Mono, monospace" fill="var(--ink)">${x.phq}</text>`).join('')}
    ${phqs.map((x, i) => `<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="var(--muted)">${pad(new Date(x.at).getDate())}/${pad(new Date(x.at).getMonth()+1)}</text>`).join('')}
  </svg>`;
}

    const nm = `<td class="sn"><b style="font-weight:600;display:block">${esc(s.name)}</b><span class="small muted">${n} de ${s.headcount} responderam</span><div class="bar" style="margin-top:6px;height:5px"><i style="width:${Math.min(100, n / s.headcount * 100).toFixed(0)}%"></i></div></td>`;
    if(n < MIN_RESP) return `<tr>${nm}${FACTORS.map(() => `<td><div class="cell hid"><b>Oculto</b><span>&lt; ${MIN_RESP} resp.</span></div></td>`).join('')}</tr>`;
    return `<tr>${nm}${sectorScores(c.id, s.id).map(x => `<td><div class="cell ${x.level}" title="${esc(x.f.name)}: exposição ${x.score.toFixed(0)} de 100 · P${x.P} × S${x.S} = ${x.R}"><b>${x.score.toFixed(0)}</b><span>${LEVELS[x.level].label}</span></div></td>`).join('')}</tr>`;
  }).join('');
  const fs = (companyFactorScores(c.id) || []).slice().sort((a, b) => b.score - a.score);
  const crit = st.cells.filter(x => x.x.R >= 8).sort((a, b) => b.x.R - a.x.R || b.x.score - a.x.score).slice(0, 5);
  return top + `<div class="kpis">${kpi('phone','violet', st.resp, 'respostas anônimas')}${kpi('users','accent', (st.rate*100).toFixed(0) + '%', 'participação')}${kpi('alert','crit', st.cells.filter(x => x.x.R >= 8).length, 'riscos altos ou críticos')}${kpi('lock','mod', st.hidden, 'setores ocultos (< ' + MIN_RESP + ' resp.)')}</div>
    ${linkCard}
    <div class="card flush"><div class="card-h"><h3>${ic('grid')} Mapa de riscos psicossociais</h3><div class="legend"><span><i style="background:var(--ok)"></i>Baixo</span><span><i style="background:var(--mod)"></i>Moderado</span><span><i style="background:var(--high)"></i>Alto</span><span><i style="background:var(--crit)"></i>Crítico</span></div></div>
      <div style="overflow-x:auto;padding:10px 12px 14px"><table class="t heat"><thead><tr><th>Setor</th>${FACTORS.map(f => `<th title="${esc(f.name)}">${esc(f.short)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
      <div style="padding:0 20px 16px" class="small muted">Número = exposição de 0 a 100. Nível = probabilidade × severidade do fator. Passe o mouse para ver o cálculo.</div></div>
    <div class="grid2">
      <div class="card stack"><h3>Exposição por fator · empresa toda</h3><div class="fbars">${fs.map(x => `<div class="fbar"><span>${esc(x.f.name)}</span><span class="tr"><i class="lv-${x.level}" style="width:${x.score.toFixed(0)}%"></i></span><span class="v">${x.score.toFixed(0)}</span></div>`).join('')}</div></div>
      <div class="card stack"><h3>Prioridades</h3><div class="prio">${crit.map((x, i) => `<div class="pi"><span class="n t-${LEVELS[x.x.level].chip}">${i+1}</span><div style="flex:1;min-width:0"><b>${esc(x.x.f.name)}</b><span>${esc(x.s.name)} · exposição ${x.x.score.toFixed(0)}</span></div><span class="chip ${LEVELS[x.x.level].chip}">${LEVELS[x.x.level].label}</span></div>`).join('') || '<p class="muted small">Nenhum risco alto ou crítico.</p>'}</div></div>
    </div>`;
}

/* NR-01 · PLANO DE AÇÃO */

  return `${head('<b>Inventário de riscos</b> · plano de ação', esc(c.name), 'Riscos altos e críticos viram ações com responsável e prazo. Edite direto na tabela.', companyPicker())}

      ${acts.map(a => { const x = curLevel(a), f = FACTORS.find(y => y.id === a.factor);

          <td>${x ? `<span class="chip ${LEVELS[x.level].chip}">${LEVELS[x.level].label}</span>` : '<span class="chip neutral">Geral</span>'}</td>

          <td><input id="ac-o-${a.id}" data-ch="ac" data-id="${a.id}" data-f="owner" value="${esc(a.owner)}" aria-label="Responsável"></td>
          <td><input id="ac-d-${a.id}" type="date" data-ch="ac" data-id="${a.id}" data-f="due" value="${esc(a.due)}" aria-label="Prazo"></td>
          <td><select id="ac-s-${a.id}" data-ch="ac" data-id="${a.id}" data-f="status" aria-label="Situação">${ACT_STATUS.map(([k, l]) => `<option value="${k}" ${a.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select></td>
          <td><button type="button" class="btn ghost sm danger" data-act="pl-del" data-id="${a.id}" aria-label="Remover ação">${ic('trash')}</button></td></tr>`; }).join('')}

/* NR-01 · RELATÓRIO */

  const inv = st.cells.filter(x => x.x.R >= 4).sort((a, b) => b.x.R - a.x.R);
  const acts = S.actions.filter(a => a.companyId === c.id);

  const period = c.opened ? `${fmtDate(new Date(c.opened))} a ${fmtDate(new Date())}` : 'coleta não iniciada';
  let matrix = '<div class="matrix"><div class="ax"></div>';

  for(let p=4;p>=1;p--){ matrix += `<div class="ax">P${p}</div>`; for(let s=1;s<=4;s++){ const k = p + '-' + s; matrix += `<div class="m ${lvl(p*s)}" title="Probabilidade ${p} × severidade ${s} = ${p*s}">${grid[k] || ''}</div>`; } }
  matrix += '</div>';
  return `${head('<b>Relatório técnico</b> · para o PGR', 'Relatório de riscos psicossociais', 'Prévia do documento. No produto, ele é exportado em PDF com a assinatura digital.', companyPicker())}

        <div class="meta"><div><span>CNPJ</span>${esc(c.cnpj)}</div><div><span>Colaboradores</span>${c.employees}</div><div><span>Período da coleta</span>${period}</div><div><span>Responsável técnica</span>${esc(DOCTOR.name)}, ${esc(DOCTOR.crm)}</div></div></div>
      <div class="dbody">
      <section class="stack"><h2><i>1</i>Objetivo</h2><p>Identificar e avaliar os fatores de riscos psicossociais relacionados ao trabalho, por setor, para inclusão no inventário de riscos e no plano de ação do Programa de Gerenciamento de Riscos (PGR), conforme o capítulo de Gerenciamento de Riscos Ocupacionais da NR-01.</p></section>
      <section class="stack"><h2><i>2</i>Método</h2><p>Questionário anônimo com ${QUESTIONS.length} itens em ${FACTORS.length} fatores, respondido em escala de frequência de 5 pontos. A exposição de cada fator vai de 0 a 100. A probabilidade (P1 a P4) vem da exposição, e a severidade (S1 a S4) é definida por fator. O nível de risco é P × S. Setores com menos de ${MIN_RESP} respostas não têm resultado divulgado.</p></section>
      <section class="stack"><h2><i>3</i>Participação</h2>
        <div class="tw" style="box-shadow:none"><table class="t"><thead><tr><th>Setor</th><th class="r">Colaboradores</th><th class="r">Respostas</th><th class="r">Participação</th><th>Resultado</th></tr></thead><tbody>
          ${c.sectors.map(s => { const n = respCount(c.id, s.id); return `<tr><td>${esc(s.name)}</td><td class="r num">${s.headcount}</td><td class="r num">${n}</td><td class="r num">${s.headcount ? (n/s.headcount*100).toFixed(0) : 0}%</td><td>${n >= MIN_RESP ? '<span class="chip ok">Divulgado</span>' : '<span class="chip neutral">Oculto</span>'}</td></tr>`; }).join('')}
          <tr><td><b>Total</b></td><td class="r num"><b>${c.employees}</b></td><td class="r num"><b>${st.resp}</b></td><td class="r num"><b>${(st.rate*100).toFixed(0)}%</b></td><td></td></tr>

      <section class="stack"><h2><i>4</i>Matriz de risco</h2><p class="small muted">Quantidade de combinações setor × fator em cada célula. Probabilidade no eixo vertical, severidade no horizontal.</p>${st.cells.length ? matrix : '<p class="muted">Sem dados suficientes.</p>'}</section>
      <section class="stack"><h2><i>5</i>Inventário de riscos psicossociais</h2>
        ${inv.length ? `<div class="tw" style="box-shadow:none"><table class="t"><thead><tr><th>Setor</th><th>Fator de risco</th><th class="r">Exposição</th><th class="r">P × S</th><th>Nível</th></tr></thead><tbody>
          ${inv.map(x => `<tr><td>${esc(x.s.name)}</td><td>${esc(x.x.f.name)}</td><td class="r num">${x.x.score.toFixed(0)}</td><td class="r num mono">${x.x.P} × ${x.x.S} = ${x.x.R}</td><td><span class="chip ${LEVELS[x.x.level].chip}">${LEVELS[x.x.level].label}</span></td></tr>`).join('')}

      <section class="stack"><h2><i>6</i>Plano de ação</h2>

          ${acts.map(a => `<tr><td>${esc(a.text)}</td><td>${esc(sec(a.sectorId))}</td><td>${esc(a.owner)}</td><td class="num">${a.due ? fmtDate(fromKey(a.due)) : '–'}</td><td><span class="chip ${a.status === 'ok' ? 'ok' : a.status === 'and' ? 'info' : 'neutral'}">${ACT_STATUS.find(s => s[0] === a.status)[1]}</span></td></tr>`).join('')}

          : `<p>O relatório é assinado pela responsável técnica com certificado digital ICP-Brasil.</p><div><button type="button" class="btn primary lg" data-act="rp-sign" ${st.cells.length ? '' : 'disabled'}>${ic('sign')}Assinar relatório</button></div>`}
      </section>
      </div>
    </article>`;
}

    const p = patient(S.ui.patient);
    const data = {titular:{nome:p.name, cpf:p.cpf, email:p.email, telefone:p.phone, nascimento:p.birth}, consentimento:p.consent,
      consultas:S.appts.filter(a => a.patientId === p.id).map(a => ({data:a.start, atendimento:svc(a.service).name, situacao:APPT_ST[a.status][0], valor:a.amount, nota_fiscal:a.nfse || null})),
      evolucoes:S.notes.filter(n => n.patientId === p.id).map(n => ({data:n.at, texto:n.text, phq9:n.phq, assinatura:n.signed.hash})),
      documentos:S.docs.filter(d => d.patientId === p.id).map(d => ({data:d.at, tipo:d.type, titulo:d.title, assinatura:d.signed.hash}))};
    log(DOCTOR.name, 'Clínica', 'Exportação de dados (LGPD)', p.name); save();
    openModal(`<div class="mhead"><span class="kb t-accent">${ic('export')}</span><div class="stack" style="gap:4px"><span class="eyebrow">Direito de acesso · LGPD</span><h2>Dados de ${esc(p.name)}</h2></div></div><p class="small muted">No produto, este arquivo é entregue ao paciente por um link seguro. A exportação fica registrada na auditoria.</p><pre id="exp-json">${esc(JSON.stringify(data, null, 2))}</pre><div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-act="copy" data-target="exp-json">Copiar</button><button type="button" class="btn primary" data-act="modal-close">Fechar</button></div>`);
  },
  'nr-open': el => { S.ui.company = el.dataset.id; save(); go('n-empresa'); },
  'nr-new': () => openModal(`<div class="mhead"><span class="kb t-violet">${ic('building')}</span><div class="stack" style="gap:4px"><span class="eyebrow">Nova empresa cliente</span><h2>Cadastrar empresa</h2></div></div>
      <label class="f">Razão social<input id="nc-name" value="Delta Serviços (exemplo)" autocomplete="off"></label>
      <label class="f">Número de colaboradores<input id="nc-emp" type="number" min="1" value="60"></label>
      <label class="f">Setores<input id="nc-sec" value="Operação, Comercial, Administrativo" autocomplete="off"><span class="hint">Separados por vírgula.</span></label>
      <p class="err" id="nc-err" hidden>Preencha nome, colaboradores e ao menos um setor.</p>
      <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-act="modal-close">Cancelar</button><button type="button" class="btn primary" data-act="nr-create">Cadastrar</button></div>`),
  'nr-create': () => {
    const name = $('#nc-name').value.trim(), emp = Number($('#nc-emp').value), secs = $('#nc-sec').value.split(',').map(s => s.trim()).filter(Boolean);
    if(!name || !emp || !secs.length){ $('#nc-err').hidden = false; return; }
    const per = Math.max(1, Math.round(emp / secs.length));
    const c = {id:uid('c'), name, cnpj:'00.000.000/0001-99', employees:emp, status:'implantacao', opened:null, segment:'Empresa cliente', sectors:secs.map((s, i) => ({id:'s' + i, name:s, headcount: i === secs.length - 1 ? Math.max(1, emp - per*(secs.length-1)) : per}))};
    S.companies.push(c); S.responses[c.id] = {}; S.ui.company = c.id;
    log(DOCTOR.name, 'NR-01', 'Empresa cadastrada', name); save(); closeModal(); toast('Empresa cadastrada'); go('n-empresa');
  },
  'nr-startcycle': () => { const c = company(S.ui.company); c.status = 'coleta'; c.opened = new Date().toISOString(); log(DOCTOR.name, 'NR-01', 'Ciclo de avaliação aberto', c.name); save(); render(); toast('Coleta aberta. Compartilhe o link.'); },
  'nr-close': () => { const c = company(S.ui.company); c.status = 'plano'; const n = genActions(c.id); log(DOCTOR.name, 'NR-01', 'Coleta encerrada e inventário gerado', `${c.name} · ${n} ações`); save(); toast(`${n} ações geradas a partir do diagnóstico`); go('n-plano'); },
  'q-open': el => { S.ui.company = el.dataset.id; qReset(el.dataset.id); save(); go('n-questionario'); },
  'q-begin': () => { if(!Q.sector){ Q.err = 'Selecione o seu setor.'; render(); return; } const c = company(Q.cid); if(c.status === 'implantacao'){ Q.err = 'A coleta desta empresa ainda não foi aberta. Abra a coleta no diagnóstico.'; render(); return; } Q.err = ''; Q.step = 'form'; render(true); },
  'q-ans': el => {
    const i = Number(el.dataset.i), v = Number(el.dataset.v); Q.ans[i] = v; Q.err = '';
    document.querySelectorAll(`[data-act="q-ans"][data-i="${i}"]`).forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.v) === v)));
    const done = Q.ans.filter(x => x != null).length; const pg = $('#q-prog'); if(pg) pg.style.width = (done / QUESTIONS.length * 100).toFixed(0) + '%'; const cnt = $('#q-count'); if(cnt) cnt.textContent = `${done}/${QUESTIONS.length}`;
  },
  'q-random': () => { Q.ans = Q.ans.map(() => Math.floor(Math.random() * 5)); const y = window.scrollY; render(); window.scrollTo(0, y); },
  'q-submit': () => {
    if(Q.ans.some(v => v == null)){ Q.err = 'Responda todas as perguntas para enviar.'; render(); return; }
    if(!S.responses[Q.cid]) S.responses[Q.cid] = {};
    if(!S.responses[Q.cid][Q.sector]) S.responses[Q.cid][Q.sector] = [];
    S.responses[Q.cid][Q.sector].push(Q.ans.slice());
    const c = company(Q.cid), s = c.sectors.find(x => x.id === Q.sector);
    log('Colaborador anônimo', 'NR-01', 'Resposta recebida', `${c.name} · ${s.name} · sem identificação`);
    save(); Q.step = 'done'; render(true);
  },
  'q-again': () => { const sec = Q.sector; qReset(Q.cid); Q.sector = sec; render(true); },
  'pl-gen': () => { const n = genActions(S.ui.company); save(); render(); toast(n ? `${n} ações adicionadas` : 'Todas as prioridades já têm ação'); },
  'pl-add': () => { const c = company(S.ui.company); S.actions.push({id:uid('ac'), companyId:c.id, sectorId:'', factor:'', text:'Nova ação', owner:'RH', due:dayKey(addDays(today0(), 60)), status:'nao'}); save(); render(); },
  'pl-del': el => { S.actions = S.actions.filter(a => a.id !== el.dataset.id); save(); render(); },
  'rp-sign': () => { const c = company(S.ui.company); openSign('Assinar relatório técnico', `<p>${esc(c.name)} · relatório de riscos psicossociais para o PGR.</p>`, async () => { const at2 = new Date().toISOString(); const h = await sha(c.id + JSON.stringify(S.responses[c.id] || {}) + at2); S.reports[c.id] = {hash:h, at:at2}; if(c.status === 'plano') c.status = 'acompanhamento'; log(DOCTOR.name, 'NR-01', 'Relatório assinado', `${c.name} · ICP-Brasil · ${shortHash(h)}`); save(); closeModal(); toast('Relatório assinado'); render(); }); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const fn = ACT[el.dataset.act]; if(fn) fn(el, e);
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && $('#modal-root').innerHTML){ closeModal(); return; }
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.co[data-act]')){ e.preventDefault(); ACT['nr-open'](e.target, e); }
});
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset.in; if(!k) return;
  if(k === 'wd'){ W.data[el.dataset.k] = el.value; }
  else if(k === 'cs-text'){ draft(S.ui.appt).text = el.value; clearTimeout(window.__svT); window.__svT = setTimeout(save, 400); }
  else if(k === 'pt-q'){ ptQuery = el.value; const pos = el.selectionStart; render(); const n = $('#pt-q'); if(n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch(x){} } }
});
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset.ch; if(!k) return;
  if(k === 'wc'){ W[el.dataset.k] = el.checked; render(); }
  else if(k === 'au-mod'){ S.ui.auditMod = el.value; save(); render(); }
  else if(k === 'nr-co'){ S.ui.company = el.value; if(route === 'n-questionario') qReset(el.value); save(); render(); }
  else if(k === 'q-sector'){ Q.sector = el.value; Q.err = ''; }
  else if(k === 'ac'){ const a = S.actions.find(x => x.id === el.dataset.id); if(a){ a[el.dataset.f] = el.value; save(); if(el.dataset.f === 'status') render(); } }
});
window.addEventListener('hashchange', () => { const r = fromHash(); if(r !== route){ route = r; render(true); } });

load();
route = fromHash();
render();
})();
</script>

</body>
</html>
